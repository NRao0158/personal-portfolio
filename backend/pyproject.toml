[project]
name = "portfolio-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]>=0.162.0,<0.163.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<0.29"]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
